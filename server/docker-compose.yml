services:
  stats:
    build: .
    image: linyu-pwa-stats:latest
    restart: unless-stopped
    ports:
      - "8787:8080"
    environment:
      DB_PATH: /data/stats.db
      PORT: "8080"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      STATS_TOKEN: ${STATS_TOKEN:-}
    volumes:
      - stats-data:/data
volumes:
  stats-data:
