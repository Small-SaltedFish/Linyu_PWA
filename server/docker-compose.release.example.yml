# v1.2.3 已发布到 GHCR。
services:
  stats:
    image: ghcr.io/small-saltedfish/linyu-pwa-stats:1.2.3
    restart: unless-stopped
    ports:
      - "8787:8080"
    environment:
      DB_PATH: /data/stats.db
      ALLOWED_ORIGINS: https://your-pwa.example.com
      STATS_TOKEN: ${STATS_TOKEN}
    volumes:
      - stats-data:/data

volumes:
  stats-data:
