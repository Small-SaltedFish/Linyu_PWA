# 镜像正式发布后使用；当前 GitHub Release 尚未发布 1.0.0 镜像。
services:
  stats:
    image: ghcr.io/small-saltedfish/linyu-pwa-stats:1.0.0
    # 或：
    # image: small-saltedfish/linyu-pwa-stats:1.0.0
    restart: unless-stopped
    ports:
      - "8787:8080"
    environment:
      DB_PATH: /data/stats.db
      ALLOWED_ORIGINS: https://your-pwa.example.com
      STATS_TOKEN: ${STATS_TOKEN}
    volumes:
      - stats-data:/data

volumes:
  stats-data:
