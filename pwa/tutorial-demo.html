<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>自动控水教程 · 动画演示</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b101b;
        --surface: #151c2d;
        --surface-2: #1d2740;
        --ink: #f4f6fb;
        --muted: #94a1b8;
        --line: rgba(255, 255, 255, 0.1);
        --primary: #7c8cf8;
        --primary-2: #a78bfa;
        --green: #3ddc97;
        --amber: #ffbd6b;
        --blue: #57b6ff;
        --phone: #080c15;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(480px 300px at 90% -10%, rgba(124, 140, 248, 0.22), transparent 70%),
          radial-gradient(420px 260px at -10% 30%, rgba(167, 139, 250, 0.14), transparent 70%),
          var(--bg);
        color: var(--ink);
        font-family: 'Inter', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
      }

      .demo {
        width: min(100%, 390px);
        text-align: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border: 1px solid rgba(124, 140, 248, 0.28);
        border-radius: 999px;
        color: #c7ceff;
        background: rgba(124, 140, 248, 0.1);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .eyebrow i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 10px var(--green);
      }

      h1 {
        margin: 15px 0 7px;
        font-size: 23px;
        line-height: 1.2;
        letter-spacing: -0.04em;
      }

      .lead {
        margin: 0 auto;
        max-width: 310px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.65;
      }

      .stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 390px;
        margin: 12px auto 0;
        perspective: 1100px;
      }

      .stage::before {
        content: '';
        position: absolute;
        width: 230px;
        height: 230px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(124, 140, 248, 0.17), transparent 68%);
        filter: blur(4px);
      }

      .orbit {
        position: absolute;
        width: 294px;
        height: 294px;
        border: 1px dashed rgba(255, 255, 255, 0.12);
        border-radius: 50%;
        transform: rotate(-18deg) scaleY(0.64);
      }

      .stage-status {
        position: absolute;
        z-index: 5;
        top: 16px;
        left: 24px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.72);
        background: rgba(21, 28, 45, 0.78);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        font-size: 8px;
        font-weight: 650;
        letter-spacing: 0.02em;
        transition: color 0.25s ease, border-color 0.25s ease;
      }

      .stage-status i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 8px var(--green);
        transition: background 0.25s ease, box-shadow 0.25s ease;
      }

      .stage.is-paused .stage-status {
        color: var(--amber);
        border-color: rgba(255, 189, 107, 0.24);
      }

      .stage.is-paused .stage-status i {
        background: var(--amber);
        box-shadow: 0 0 8px var(--amber);
      }

      .stage.is-finished .stage-status {
        color: var(--blue);
        border-color: rgba(87, 182, 255, 0.22);
      }

      .stage.is-finished .stage-status i {
        background: var(--blue);
        box-shadow: 0 0 8px var(--blue);
      }

      .shower {
        position: absolute;
        z-index: 4;
        top: 20px;
        right: 28px;
        width: 92px;
        height: 155px;
        pointer-events: none;
      }

      .shower__arm {
        position: absolute;
        top: 5px;
        right: -3px;
        width: 40px;
        height: 22px;
        border-top: 2px solid rgba(183, 197, 225, 0.56);
        border-left: 2px solid rgba(183, 197, 225, 0.56);
        border-radius: 22px 0 0 0;
        transform: rotate(-12deg);
        opacity: 0.72;
      }

      .shower__head {
        position: absolute;
        top: 21px;
        right: 0;
        width: 56px;
        height: 18px;
        border-radius: 50% 50% 44% 44%;
        background: linear-gradient(180deg, #7b88a8, #34415e 58%, #1b253b);
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.24), 0 0 18px rgba(124, 140, 248, 0.18);
        transform: rotate(11deg);
      }

      .shower__head::before {
        content: '';
        position: absolute;
        right: 9px;
        bottom: -3px;
        width: 34px;
        height: 7px;
        border-radius: 50%;
        background-image: radial-gradient(circle, #0b1321 1.2px, transparent 1.6px);
        background-size: 6px 5px;
        background-position: 1px 1px;
        opacity: 0.9;
      }

      .shower__head::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 8px;
        width: 25px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        filter: blur(1px);
      }

      .shower__streams {
        position: absolute;
        top: 39px;
        right: 7px;
        width: 42px;
        height: 110px;
        transform: rotate(11deg);
        transform-origin: top center;
      }

      .shower__streams i {
        position: absolute;
        top: 0;
        width: 1px;
        height: 48px;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(87, 182, 255, 0.08), rgba(87, 182, 255, 0.68), transparent);
        animation: shower-flow 1.25s linear infinite;
      }

      .shower__streams i:nth-child(1) { left: 3px; height: 40px; animation-delay: -0.2s; }
      .shower__streams i:nth-child(2) { left: 8px; height: 54px; animation-delay: -0.7s; }
      .shower__streams i:nth-child(3) { left: 14px; height: 46px; animation-delay: -1.1s; }
      .shower__streams i:nth-child(4) { left: 20px; height: 58px; animation-delay: -0.45s; }
      .shower__streams i:nth-child(5) { left: 26px; height: 42px; animation-delay: -0.9s; }

      @keyframes shower-flow {
        0% { opacity: 0; transform: translateY(-8px) scaleY(0.6); }
        15% { opacity: 1; }
        100% { opacity: 0; transform: translateY(66px) scaleY(1.1); }
      }

      .stage.is-paused .shower__streams i,
      .stage.is-finished .shower__streams i {
        animation: none;
        opacity: 0;
      }

      .table {
        position: absolute;
        z-index: 1;
        bottom: 25px;
        width: 300px;
        height: 130px;
        border: 1px solid rgba(87, 182, 255, 0.1);
        border-radius: 50%;
        background:
          radial-gradient(ellipse at 50% 38%, rgba(87, 182, 255, 0.15), transparent 62%),
          linear-gradient(180deg, rgba(30, 43, 72, 0.48), rgba(14, 21, 36, 0.12));
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.24);
        transform: rotateX(61deg);
        transform-style: preserve-3d;
      }

      .table__grid {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        opacity: 0.4;
        background-image:
          linear-gradient(rgba(124, 140, 248, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(124, 140, 248, 0.16) 1px, transparent 1px);
        background-size: 26px 26px;
        mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
        -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
      }

      .table__label {
        position: absolute;
        right: 20px;
        bottom: 12px;
        color: rgba(148, 161, 184, 0.5);
        font-size: 8px;
        letter-spacing: 0.12em;
      }

      .phone-shadow {
        position: absolute;
        z-index: 2;
        bottom: 36px;
        width: 168px;
        height: 28px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.46);
        filter: blur(11px);
        opacity: 0.48;
        transition: transform 0.85s cubic-bezier(0.22, 0.9, 0.24, 1), opacity 0.85s ease;
      }

      .phone-shadow.is-scan { transform: translateY(-4px) scale(0.9); opacity: 0.35; }
      .phone-shadow.is-facedown { transform: translateY(34px) scale(1.2); opacity: 0.55; }
      .phone-shadow.is-faceup { transform: translateY(34px) scale(1.22); opacity: 0.55; }
      .phone-shadow.is-vertical { transform: translateY(-8px) scale(0.8); opacity: 0.3; }

      .angle-mark {
        position: absolute;
        z-index: 4;
        right: 38px;
        bottom: 164px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        color: var(--primary);
        opacity: 0;
        transform: translateX(6px);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }

      .stage.is-vertical .angle-mark {
        opacity: 1;
        transform: translateX(0);
      }

      .angle-mark i {
        display: block;
        width: 50px;
        height: 42px;
        border-top: 1px dashed rgba(124, 140, 248, 0.6);
        border-right: 1px dashed rgba(124, 140, 248, 0.6);
        border-radius: 0 20px 0 0;
        transform: skewX(-18deg);
      }

      .angle-mark b {
        font-size: 12px;
        font-weight: 750;
        letter-spacing: -0.03em;
      }

      .angle-mark small {
        color: var(--muted);
        font-size: 7px;
        letter-spacing: 0.1em;
      }

      .orbit::after {
        content: '';
        position: absolute;
        top: -3px;
        left: 50%;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--primary);
        box-shadow: 0 0 12px var(--primary);
      }

      .phone {
        position: relative;
        z-index: 2;
        width: 178px;
        height: 348px;
        border: 2px solid #3b4764;
        border-radius: 30px;
        background: var(--phone);
        box-shadow:
          0 34px 60px rgba(0, 0, 0, 0.5),
          0 2px 0 rgba(255, 255, 255, 0.06) inset,
          0 0 0 1px rgba(255, 255, 255, 0.04);
        transform-style: preserve-3d;
        transform: rotateX(0deg) rotateZ(0deg) scale(0.92);
        transition: transform 0.85s cubic-bezier(0.22, 0.9, 0.24, 1), box-shadow 0.85s ease;
        will-change: transform;
      }

      .phone.is-scan {
        transform: translateY(-24px) rotateX(-12deg) rotateZ(0deg) scale(0.9);
      }

      .phone.is-faceup {
        transform: translateY(86px) rotateX(65deg) rotateY(0deg) scale(0.86);
        box-shadow: 0 20px 38px rgba(0, 0, 0, 0.38);
      }

      .phone.is-facedown {
        transform: translateY(86px) rotateX(65deg) rotateY(180deg) scale(0.86);
      }

      .phone.is-vertical {
        transform: translateY(-42px) rotateX(0deg) rotateZ(0deg) scale(0.88);
      }

      .phone__front,
      .phone__back {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        overflow: hidden;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .phone__front {
        padding: 9px;
        background: #050812;
      }

      .phone__back {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 14px;
        padding-bottom: 40px;
        transform: rotateY(180deg);
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.06), transparent 45%),
          #1b2338;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .camera-plateau {
        position: absolute;
        top: 9px;
        left: 10px;
        right: 10px;
        height: 82px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 23px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.06), transparent 44%),
          #151d2e;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.07),
          0 8px 18px rgba(0, 0, 0, 0.28);
      }

      .camera-lenses {
        position: absolute;
        top: 9px;
        left: 12px;
        width: 78px;
        height: 64px;
      }

      .lens {
        position: absolute;
        display: block;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 38% 31%, #5c6d9d 0 7%, #273555 8% 19%, #0a101c 20% 48%, #03060b 49% 100%);
        box-shadow:
          0 0 0 3px #101827,
          0 0 0 4px rgba(255, 255, 255, 0.08),
          inset 0 0 0 2px #02040a,
          0 4px 7px rgba(0, 0, 0, 0.42);
      }

      .lens::after {
        content: '';
        position: absolute;
        top: 6px;
        left: 7px;
        width: 7px;
        height: 5px;
        border-radius: 50%;
        background: rgba(137, 166, 255, 0.48);
        filter: blur(1px);
        transform: rotate(-30deg);
      }

      .lens--one { top: 0; left: 0; }
      .lens--two { bottom: 0; left: 0; }
      .lens--three { top: 17px; left: 38px; }

      .camera-extras {
        position: absolute;
        top: 15px;
        right: 13px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .flash {
        display: block;
        width: 12px;
        height: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff8d6, #b49a55 45%, #3e3520 70%);
        box-shadow: 0 0 9px rgba(255, 225, 150, 0.24);
      }

      .lidar {
        display: block;
        width: 9px;
        height: 9px;
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 50%;
        background: #080d16;
        box-shadow: inset 0 0 0 2px #111a2a;
      }

      .phone__back small {
        color: rgba(255, 255, 255, 0.42);
        font-size: 9px;
        letter-spacing: 0.18em;
      }

      .phone__back strong {
        color: var(--amber);
        font-size: 13px;
      }

      .screen {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 15px 14px 13px;
        border-radius: 22px;
        overflow: hidden;
        background:
          radial-gradient(160px 100px at 110% -10%, rgba(124, 140, 248, 0.32), transparent 70%),
          linear-gradient(160deg, #202a4a, #11182b 62%);
      }

      .screen__top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: rgba(255, 255, 255, 0.68);
        font-size: 8px;
        font-weight: 650;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 7px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
      }

      .status i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 9px var(--green);
        transition: background 0.25s ease, box-shadow 0.25s ease;
      }

      .phone.is-paused .status i {
        background: var(--amber);
        box-shadow: 0 0 9px var(--amber);
      }

      .phone.is-finished .status i {
        background: var(--blue);
        box-shadow: 0 0 9px var(--blue);
      }

      .water {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        min-height: 0;
      }

      .water__halo {
        position: absolute;
        width: 112px;
        height: 112px;
        border: 1px solid rgba(87, 182, 255, 0.16);
        border-radius: 50%;
        transition: opacity 0.35s ease;
      }

      .water__halo::before,
      .water__halo::after {
        content: '';
        position: absolute;
        inset: 15px;
        border: 1px solid rgba(87, 182, 255, 0.12);
        border-radius: 50%;
      }

      .water__halo::after {
        inset: 30px;
      }

      .drop {
        position: relative;
        z-index: 2;
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border: 1px solid rgba(87, 182, 255, 0.28);
        border-radius: 50%;
        color: #dff6ff;
        background: radial-gradient(circle at 35% 25%, rgba(87, 182, 255, 0.5), rgba(31, 110, 180, 0.24));
        box-shadow: 0 0 30px rgba(87, 182, 255, 0.18);
        font-size: 25px;
        transition: opacity 0.35s ease, transform 0.35s ease;
      }

      .phone.is-paused .drop {
        opacity: 0.4;
        transform: scale(0.88);
      }

      .phone.is-finished .drop {
        opacity: 0.18;
      }

      .streams {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 18px;
      }

      .streams span {
        position: absolute;
        bottom: -18px;
        width: 2px;
        height: 22px;
        border-radius: 999px;
        background: linear-gradient(180deg, transparent, rgba(87, 182, 255, 0.7));
        animation: rise 1.8s linear infinite;
      }

      .streams span:nth-child(1) { left: 28%; animation-delay: -0.3s; }
      .streams span:nth-child(2) { left: 44%; height: 30px; animation-delay: -1.1s; }
      .streams span:nth-child(3) { left: 60%; animation-delay: -0.7s; }
      .streams span:nth-child(4) { left: 72%; height: 17px; animation-delay: -1.5s; }

      .phone.is-paused .streams span,
      .phone.is-finished .streams span {
        animation-play-state: paused;
        opacity: 0;
      }

      @keyframes rise {
        0% { opacity: 0; transform: translateY(0) scaleY(0.7); }
        20% { opacity: 0.9; }
        100% { opacity: 0; transform: translateY(-150px) scaleY(1.1); }
      }

      .screen__bottom {
        position: relative;
        z-index: 2;
        padding-top: 9px;
        border-top: 1px solid rgba(255, 255, 255, 0.09);
        text-align: left;
      }

      .amount {
        font-size: 21px;
        font-weight: 760;
        letter-spacing: -0.04em;
      }

      .amount small {
        margin-right: 2px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 11px;
      }

      .phone-hint {
        margin-top: 3px;
        color: rgba(255, 255, 255, 0.48);
        font-size: 8px;
      }

      .scan-layer {
        position: absolute;
        z-index: 3;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 13px;
        border-radius: 22px;
        background: rgba(8, 13, 24, 0.42);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .phone.is-scan .scan-layer {
        opacity: 1;
      }

      .scan-frame {
        width: 76px;
        height: 76px;
        border: 1px solid rgba(124, 140, 248, 0.8);
        border-radius: 16px;
        box-shadow: 0 0 0 5px rgba(124, 140, 248, 0.08), 0 0 24px rgba(124, 140, 248, 0.18);
      }

      .scan-line {
        position: absolute;
        top: 50%;
        width: 66px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #9aa7ff, transparent);
        box-shadow: 0 0 10px rgba(154, 167, 255, 0.9);
        animation: scan 1.8s ease-in-out infinite;
      }

      .scan-copy {
        color: #c7ceff;
        font-size: 8px;
        letter-spacing: 0.08em;
      }

      @keyframes scan {
        0%, 100% { transform: translateY(-30px); opacity: 0.2; }
        50% { transform: translateY(30px); opacity: 1; }
      }

      .screen__finish {
        position: absolute;
        z-index: 3;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: 22px;
        background: rgba(8, 13, 24, 0.84);
        backdrop-filter: blur(3px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .phone.is-finished .screen__finish {
        opacity: 1;
      }

      .finish-icon {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        color: #072018;
        background: var(--green);
        font-size: 18px;
        font-weight: 800;
      }

      .screen__finish strong {
        font-size: 12px;
      }

      .screen__finish span {
        color: var(--muted);
        font-size: 8px;
      }

      .caption-card {
        position: relative;
        margin-top: -2px;
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(21, 28, 45, 0.8);
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.22);
      }

      .caption-card__top {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: var(--primary);
        font-size: 10px;
        font-weight: 700;
      }

      .caption-card__top .step-index {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        font-size: 9px;
      }

      .caption-card h2 {
        margin: 7px 0 3px;
        font-size: 15px;
        letter-spacing: -0.02em;
      }

      .caption-card p {
        margin: 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.55;
      }

      .caption-card .caption-note {
        margin-top: 6px;
        color: rgba(199, 206, 255, 0.76);
        font-size: 9px;
        line-height: 1.6;
      }

      .steps {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin: 13px 0 0;
      }

      .steps span {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        transition: width 0.3s ease, background 0.3s ease;
      }

      .steps span.active {
        width: 18px;
        background: var(--primary);
      }

      .footer-note {
        margin: 14px auto 0;
        max-width: 310px;
        color: rgba(148, 161, 184, 0.8);
        font-size: 9px;
        line-height: 1.6;
      }

      .replay {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 13px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.05);
        font-size: 10px;
        font-weight: 650;
      }

      .replay:active { transform: scale(0.97); }

      @media (max-width: 380px) {
        .stage { height: 360px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .phone,
        .drop,
        .streams span,
        .steps span {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <span class="eyebrow"><i></i> 自动控水 · 30 秒学会</span>
      <h1>手机会自己判断姿态</h1>
      <p class="lead">自动模式通过检测手机朝向工作：屏幕朝下暂停，朝上继续，竖直 3 秒结束。</p>

      <div class="stage" id="stage">
        <span class="orbit"></span>
        <span class="stage-status" id="stageStatus"><i></i><span>正在用水</span></span>
        <span class="shower" aria-hidden="true">
          <span class="shower__arm"></span>
          <span class="shower__head"></span>
          <span class="shower__streams">
            <i></i><i></i><i></i><i></i><i></i>
          </span>
        </span>
        <div class="table" aria-hidden="true">
          <span class="table__grid"></span>
          <span class="table__label">桌面</span>
        </div>
        <span class="phone-shadow" id="shadow" aria-hidden="true"></span>
        <span class="angle-mark" id="angleMark" aria-hidden="true">
          <i></i><b>90°</b><small>与地面</small>
        </span>
        <div class="phone is-scan" id="phone">
          <div class="phone__front">
            <div class="screen">
              <div class="screen__top">
                <span>淋浴中</span>
                <span class="status"><i></i><span id="statusText">正在用水</span></span>
              </div>
              <div class="water">
                <span class="water__halo"></span>
                <div class="streams"><span></span><span></span><span></span><span></span></div>
                <div class="drop">
                  <svg viewBox="0 0 24 24" width="27" height="27" fill="none" aria-hidden="true">
                    <path d="M12 3.2S5.8 10.4 5.8 14.8a6.2 6.2 0 0 0 12.4 0C18.2 10.4 12 3.2 12 3.2Z" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M9.2 15.2c.2 1.4 1.3 2.3 2.7 2.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                  </svg>
                </div>
              </div>
              <div class="screen__bottom">
                <div class="amount"><small>¥</small><span id="amountText">0.18</span></div>
                <div class="phone-hint" id="phoneHint">保持竖立，水正常流动</div>
              </div>
              <div class="scan-layer">
                <span class="scan-frame"></span>
                <span class="scan-line"></span>
                <span class="scan-copy">正在扫码</span>
              </div>
              <div class="screen__finish">
                <span class="finish-icon">✓</span>
                <strong>本次用水已结束</strong>
                <span>回到首页查看结算</span>
              </div>
            </div>
          </div>
          <div class="phone__back">
            <span class="camera-plateau">
              <span class="camera-lenses">
                <i class="lens lens--one"></i>
                <i class="lens lens--two"></i>
                <i class="lens lens--three"></i>
              </span>
              <span class="camera-extras">
                <i class="flash"></i>
                <i class="lidar"></i>
              </span>
            </span>
            <small>手机背面</small>
            <strong id="backStatus">已暂停</strong>
          </div>
        </div>
      </div>

      <section class="caption-card">
        <div class="caption-card__top"><span class="step-index" id="stepNo">1</span><span id="stepTag">正常用水</span></div>
        <h2 id="captionTitle">扫码开始用水</h2>
        <p id="captionText">扫码开始用水，并打开自动模式。接下来不用再点按钮。</p>
        <p class="caption-note" id="captionNote"></p>
      </section>

      <div class="steps" id="steps" aria-hidden="true">
        <span class="active"></span><span></span><span></span><span></span>
      </div>

      <p class="footer-note">首次进入自动模式有 15 秒防误触保护；这段时间拿起手机不会结束用水。</p>
      <button class="replay" type="button" id="replay">↻ 重播演示</button>
    </main>

    <script>
      const phone = document.getElementById('phone')
      const statusText = document.getElementById('statusText')
      const backStatus = document.getElementById('backStatus')
      const phoneHint = document.getElementById('phoneHint')
      const stepNo = document.getElementById('stepNo')
      const stepTag = document.getElementById('stepTag')
      const captionTitle = document.getElementById('captionTitle')
      const captionText = document.getElementById('captionText')
      const captionNote = document.getElementById('captionNote')
      const shadow = document.getElementById('shadow')
      const stage = document.getElementById('stage')
      const stageStatus = document.querySelector('#stageStatus span')
      const steps = [...document.querySelectorAll('#steps span')]

      const states = [
        {
          key: 'scan',
          tag: '开始用水',
          title: '扫码并打开自动模式',
          text: '扫码开始用水，并打开自动模式。接下来不用再点按钮。',
          hint: '自动模式已开启',
          paused: false,
          finished: false,
          delay: 1900,
        },
        {
          key: 'faceDown',
          tag: '屏幕朝下',
          title: '扣在桌上',
          text: '屏幕朝下，扣在桌面上，水会自动暂停。',
          hint: '扣下后已暂停',
          paused: true,
          finished: false,
          delay: 2300,
        },
        {
          key: 'faceUp',
          tag: '屏幕朝上',
          title: '正面平放',
          text: '屏幕朝上，平放在同一个桌面，水会自动继续。',
          hint: '翻回正面，继续用水',
          paused: false,
          finished: false,
          delay: 2300,
        },
        {
          key: 'vertical',
          tag: '90° 竖直',
          title: '与地面成 90°',
          text: '把手机竖直拿起，与地面成 90°，保持约 3 秒，自动结束用水。',
          hint: '保持 3 秒，准备结束',
          paused: false,
          finished: false,
          delay: 3000,
        },
      ]

      let timer = 0
      let index = 0

      function render(state) {
        phone.className = `phone is-${state.key.toLowerCase()}${state.paused ? ' is-paused' : ''}${state.finished ? ' is-finished' : ''}`
        shadow.className = `phone-shadow is-${state.key.toLowerCase()}`
        stage.classList.toggle('is-vertical', state.key === 'vertical')
        stage.classList.toggle('is-paused', Boolean(state.paused))
        stage.classList.toggle('is-finished', Boolean(state.finished))
        statusText.textContent = state.finished ? '已结束' : state.paused ? '已暂停' : state.key === 'vertical' ? '检测中' : '正在用水'
        stageStatus.textContent = state.finished ? '已结束' : state.paused ? '已暂停' : state.key === 'vertical' ? '检测姿态' : '正在用水'
        backStatus.textContent = state.paused ? '已暂停' : '正在用水'
        phoneHint.textContent = state.hint
        stepNo.textContent = String(index + 1)
        stepTag.textContent = state.tag
        captionTitle.textContent = state.title
        captionText.textContent = state.text
        captionNote.textContent = state.key === 'vertical' ? '点击按钮和长按空白处 5 秒也可停止。' : ''
        steps.forEach((dot, i) => dot.classList.toggle('active', i === index))
      }

      function finishVertical() {
        phone.classList.add('is-finished')
        stage.classList.remove('is-paused')
        stage.classList.add('is-finished')
        statusText.textContent = '已结束'
        stageStatus.textContent = '已结束'
        phoneHint.textContent = '已结束，查看结算'
      }

      function playNext() {
        render(states[index])
        const state = states[index]
        timer = window.setTimeout(() => {
          if (index === states.length - 1) {
            finishVertical()
            return
          }
          index += 1
          playNext()
        }, state.delay)
      }

      function start() {
        window.clearTimeout(timer)
        phone.classList.remove('is-finished')
        stage.classList.remove('is-finished', 'is-paused')
        index = 0
        playNext()
      }

      function setState(name) {
        window.clearTimeout(timer)
        const next = states.findIndex((state) => state.key === name)
        if (next < 0) return
        index = next
        render(states[index])
      }

      window.setTutorialState = setState
      window.finishTutorial = finishVertical
      window.setTutorialStep = (next) => {
        window.clearTimeout(timer)
        index = Math.max(0, Math.min(states.length - 1, Number(next) || 0))
        phone.classList.remove('is-finished')
        stage.classList.remove('is-finished', 'is-paused')
        render(states[index])
      }
      document.getElementById('replay').addEventListener('click', start)
      start()
    </script>
  </body>
</html>
